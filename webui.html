<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoVSR 4× 超分</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1b2230; --line:#232c3d;
    --txt:#e6ecf5; --dim:#8b99b0; --acc:#4d8dff; --acc2:#22c55e; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#17223a 0%,var(--bg) 55%) fixed;
       color:var(--txt);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  h1 b{color:var(--acc)}
  .sub{color:var(--dim);font-size:13px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  .card h2{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  .drop{border:1.5px dashed #33415c;border-radius:12px;padding:26px 18px;text-align:center;cursor:pointer;
        transition:.18s;background:#101623}
  .drop:hover,.drop.on{border-color:var(--acc);background:#121c30}
  .drop .big{font-size:15px;margin-bottom:6px}
  .drop .hint{color:var(--dim);font-size:12.5px}
  .fname{margin-top:10px;font-size:13px;color:var(--acc);word-break:break-all;min-height:20px}
  .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
  .fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  label em{font-style:normal;color:#5f6d85;margin-left:5px}
  select,input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
               border-radius:8px;padding:8px 10px;font:inherit;outline:none}
  select:focus,input:focus{border-color:var(--acc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9px;
       padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.16s}
  .btn.main{background:linear-gradient(180deg,#5b96ff,#3f74e0);color:#fff;width:100%;margin-top:18px}
  .btn.main:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);padding:6px 11px;font-weight:500;font-size:12.5px}
  .btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
  .btn.danger:hover{border-color:var(--err);color:var(--err)}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar{height:7px;border-radius:99px;background:#1d2534;overflow:hidden;margin:14px 0 8px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3f74e0,#5b96ff);transition:width .3s}
  .stat{display:flex;justify-content:space-between;color:var(--dim);font-size:12.5px}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-right:6px}
  .badge.ok{color:#7ee2a8;border-color:#2c6b46;background:#11251b}
  .badge.off{color:#c2a05a;border-color:#5b4a20;background:#241d0f}
  .preview{margin-top:14px;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}
  .preview video,.preview img{display:block;width:100%;max-height:420px;object-fit:contain;background:#000}
  .err{color:#ff9b9b;background:#2a1215;border:1px solid #5b2026;border-radius:9px;padding:10px 12px;
       font-size:12.5px;white-space:pre-wrap;margin-top:12px;max-height:180px;overflow:auto}
  .logbox{margin-top:12px;background:#0d121b;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
          font:12px/1.5 Consolas,monospace;color:#8296b3;max-height:130px;overflow:auto;white-space:pre-wrap}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
  .hist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .hitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
          border-radius:10px;background:#111721}
  .hitem:hover{border-color:#31406a}
  .hitem .nm{flex:1;min-width:0}
  .hitem .nm b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hitem .nm span{font-size:11.5px;color:var(--dim)}
  .hitem.gone{opacity:.5}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1e2a40;
         border:1px solid #33456b;color:#dfe8f7;padding:10px 18px;border-radius:10px;opacity:0;
         transition:.25s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .muted{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NanoVSR <b>4×</b> 超分</h1>
    <span class="sub">本地 Vulkan 推理 · 音轨字幕原样保留</span>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>素材</h2>
        <div class="drop" id="drop">
          <div class="big">点击选择，或把视频 / 图片拖进来</div>
          <div class="hint">mp4 / mkv / mov / webm / png / jpg</div>
          <div class="fname" id="fname"></div>
        </div>
        <input type="file" id="file" accept="video/*,image/*" style="display:none">

        <div class="fields">
          <div>
            <label>模型</label>
            <select id="model">
              <option value="1.7m">1.7M — 均衡（推荐）</option>
              <option value="644k">644K — 最快</option>
              <option value="5.4m">5.4M — 最精细</option>
            </select>
          </div>
          <div>
            <label>档位</label>
            <select id="preset">
              <option value="balanced">均衡</option>
              <option value="preview">预览（快）</option>
              <option value="quality">画质（慢）</option>
            </select>
          </div>
        </div>

        <div class="fields three">
          <div>
            <label>chunk <em>（0 = 跟随档位）</em></label>
            <input id="chunk" type="number" min="0" max="30" step="1" placeholder="0">
          </div>
          <div>
            <label>tile <em>（如 200x144）</em></label>
            <input id="tile" type="text" placeholder="自动">
          </div>
          <div>
            <label>crf <em>（-1 = 跟随档位）</em></label>
            <input id="crf" type="number" min="-1" max="51" step="1" placeholder="-1">
          </div>
        </div>
        <div class="fields">
          <div>
            <label>限制帧数 <em>（0 = 全部）</em></label>
            <input id="limit" type="number" min="0" step="1" placeholder="0">
          </div>
          <div>
            <label>说明</label>
            <div class="muted" id="tip">分块显存占用：tile 越大越快、越吃显存</div>
          </div>
        </div>

        <button class="btn main" id="start" disabled>开始超分</button>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="between" style="margin-bottom:2px">
          <h2 style="margin:0">进度</h2>
          <span class="muted" id="stateTxt">空闲</span>
        </div>
        <div class="bar"><i id="barIn"></i></div>
        <div class="stat"><span id="framesTxt">—</span><span id="speedTxt">—</span></div>
        <div id="idle" class="muted" style="margin-top:14px">选好素材后点「开始超分」。音频与字幕会自动接回结果文件。</div>
        <div id="banner"></div>
        <div id="preview"></div>
        <div id="err" class="err" style="display:none"></div>
        <div id="log" class="logbox" style="display:none"></div>
        <div id="dlrow" class="row" style="margin-top:12px;display:none">
          <a class="btn ghost" id="dl" download>下载结果</a>
          <span class="muted" id="sizeTxt"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="between">
      <h2 style="margin:0">历史记录</h2>
      <div class="row">
        <button class="btn ghost" id="refresh">刷新</button>
        <button class="btn ghost danger" id="clear">清空全部</button>
      </div>
    </div>
    <div class="hist" id="hist"><div class="empty">暂无记录</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var picked = null, pollTimer = null, curId = null;

function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
function fmtDur(s){
  if(!s || s < 0) return "—";
  if(s < 60) return s.toFixed(1) + " 秒";
  var m = Math.floor(s / 60), r = Math.round(s % 60);
  return m + " 分 " + r + " 秒";
}
function fmtSize(b){
  if(!b) return "";
  if(b < 1024 * 1024) return (b / 1024).toFixed(0) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}
function fmtTime(t){
  if(!t) return "";
  var d = new Date(t * 1000);
  function p(n){ return n < 10 ? "0" + n : "" + n; }
  return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// ---- 选择文件 ----
$("drop").onclick = function(){ $("file").click(); };
$("file").onchange = function(){ if(this.files[0]) pick(this.files[0]); };
$("drop").addEventListener("dragover", function(e){ e.preventDefault(); this.classList.add("on"); });
$("drop").addEventListener("dragleave", function(){ this.classList.remove("on"); });
$("drop").addEventListener("drop", function(e){
  e.preventDefault(); this.classList.remove("on");
  if(e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
});
function pick(f){
  picked = f;
  $("fname").textContent = f.name + "  ·  " + fmtSize(f.size);
  $("start").disabled = false;
}

// ---- 开始 ----
$("start").onclick = function(){
  if(!picked) return;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  var tile = ($("tile").value || "").trim().toLowerCase();
  if(tile && !/^[0-9]{2,5}x[0-9]{2,5}$/.test(tile)){ toast("tile 格式应如 200x144"); return; }
  var qs = new URLSearchParams({
    name: picked.name,
    model: $("model").value,
    preset: $("preset").value,
    chunk: $("chunk").value || "0",
    tile: tile,
    crf: $("crf").value || "-1",
    limit: $("limit").value || "0"
  });
  $("start").disabled = true;
  $("start").textContent = "上传中…";
  $("preview").innerHTML = "";
  $("err").style.display = "none";
  $("log").style.display = "none";
  $("dlrow").style.display = "none";
  $("banner").innerHTML = "";
  $("idle").style.display = "none";
  $("stateTxt").textContent = "上传中";
  $("barIn").style.width = "0%";
  $("framesTxt").textContent = "—";
  $("speedTxt").textContent = "—";

  fetch("/api/run?" + qs.toString(), { method: "POST", body: picked })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.id) throw new Error(d.error || "启动失败");
      curId = d.id;
      $("start").textContent = "开始超分";
      $("start").disabled = false;
      pollTimer = setInterval(poll, 700);
      poll();
      loadHist();
    })
    .catch(function(e){
      $("start").textContent = "开始超分";
      $("start").disabled = false;
      $("stateTxt").textContent = "失败";
      showErr(e.message);
    });
};

// ---- 轮询 ----
function poll(){
  if(!curId) return;
  fetch("/api/status?id=" + curId).then(function(r){ return r.json(); }).then(function(d){
    if(d.error) return;
    var st = d.state || "running";
    $("stateTxt").textContent = st === "done" ? "完成" : (st === "error" ? "失败" : "处理中");
    var tot = d.total || 0, fr = d.frames || 0;
    var pct = tot > 0 ? Math.min(100, fr / tot * 100) : (st === "done" ? 100 : 0);
    $("barIn").style.width = pct.toFixed(1) + "%";
    $("framesTxt").textContent = tot > 0 ? (fr + " / " + tot + " 帧") : (fr ? (fr + " 帧") : "—");
    if(d.elapsed > 0.5 && fr > 0) $("speedTxt").textContent = (fr / d.elapsed).toFixed(2) + " 帧/秒";
    $("log").style.display = "block";
    $("log").textContent = (d.log || "").slice(-900);
    if(st === "done"){
      clearInterval(pollTimer); pollTimer = null;
      onDone(d);
      loadHist();
    } else if(st === "error"){
      clearInterval(pollTimer); pollTimer = null;
      showErr(d.err || "处理失败");
      loadHist();
    }
  }).catch(function(){});
}

function showErr(msg){
  $("err").style.display = "block";
  $("err").textContent = msg;
}

function onDone(d){
  $("barIn").style.width = "100%";
  $("stateTxt").textContent = "完成";
  $("idle").style.display = "none";
  if(d.frames || d.total){ $("framesTxt").textContent = (d.frames || 0) + " / " + (d.total || d.frames || 0) + " 帧"; }
  $("speedTxt").textContent = fmtDur(d.elapsed);
  var url = "/api/out/" + d.id + "?t=" + Date.now();
  var b = [];
  if(d.is_img){
    b.push('<span class="badge ok">图片</span>');
  } else if(d.audio){
    b.push('<span class="badge ok">音轨已保留</span>');
  } else {
    b.push('<span class="badge off">无音轨</span>');
  }
  if(!d.is_img){
    if(d.subs) b.push('<span class="badge ok">字幕已保留</span>');
    else b.push('<span class="badge">无字幕</span>');
  }
  if(d.mux_err) b.push('<span class="badge off">' + d.mux_err + '</span>');
  $("banner").innerHTML = '<div style="margin-top:10px">' + b.join("") + '</div>';
  if(d.is_img){
    $("preview").innerHTML = '<div class="preview"><img src="' + url + '"></div>';
  } else {
    $("preview").innerHTML = '<div class="preview"><video src="' + url + '" controls playsinline></video></div>';
  }
  $("dl").href = url;
  $("dl").setAttribute("download", (d.name || "out") + "_4x" + (d.is_img ? ".png" : (d.subs ? ".mkv" : ".mp4")));
  $("dlrow").style.display = "flex";
  $("sizeTxt").textContent = fmtSize(d.size) + " · " + fmtDur(d.elapsed);
}

// ---- 历史 ----
function loadHist(){
  fetch("/api/history").then(function(r){ return r.json(); }).then(function(d){
    var items = d.items || [];
    var box = $("hist");
    if(!items.length){ box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
    box.innerHTML = "";
    items.forEach(function(it){
      var el = document.createElement("div");
      el.className = "hitem" + (it.exists ? "" : " gone");
      var bits = [];
      bits.push(it.model || "?");
      bits.push(it.preset || "?");
      if(it.chunk) bits.push("chunk " + it.chunk);
      if(it.tile) bits.push("tile " + it.tile);
      if(it.crf >= 0) bits.push("crf " + it.crf);
      var meta = bits.join(" · ") + " · " + (it.total ? (it.total + " 帧") : (it.frames + " 帧"));
      if(it.elapsed) meta += " · " + fmtDur(it.elapsed);
      if(it.size) meta += " · " + fmtSize(it.size);
      if(!it.exists) meta += " · 文件已删";
      el.innerHTML = '<div class="nm"><b></b><span></span></div>' +
        '<div class="row">' +
        (it.exists && it.state === "done" ? '<a class="btn ghost" href="/api/out/' + it.id + '" download>下载</a>' : '') +
        '<button class="btn ghost danger">删除</button></div>';
      el.querySelector("b").textContent = it.name || it.id;
      el.querySelector("span").textContent = fmtTime(it.created) + " · " + meta;
      el.querySelector("button").onclick = function(){
        fetch("/api/history/delete?id=" + it.id, { method: "POST" })
          .then(function(){ toast("已删除"); loadHist(); });
      };
      box.appendChild(el);
    });
  }).catch(function(){});
}
$("refresh").onclick = loadHist;
$("clear").onclick = function(){
  if(!confirm("清空全部历史（连同结果文件）？")) return;
  fetch("/api/history/clear", { method: "POST" }).then(function(r){ return r.json(); })
    .then(function(d){ toast("已清空 " + (d.removed || 0) + " 条"); loadHist(); });
};
loadHist();
</script>
</body>
</html>
